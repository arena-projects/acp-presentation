<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="t">
  <title id="t">Graph mit 11 Knoten und 11 Kanten; die Kanten stehen vollständig in vertex-cover.txt</title>
  <rect width="680" height="380" fill="#FFFFFF"/>
  <g stroke="#4A5468" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="60" x2="160" y2="100"/>   <!-- 1-2 -->
    <line x1="160" y1="100" x2="140" y2="220"/> <!-- 2-3 -->
    <line x1="160" y1="100" x2="280" y2="80"/>  <!-- 2-4 -->
    <line x1="140" y1="220" x2="60" y2="300"/>  <!-- 3-11 -->
    <line x1="280" y1="80" x2="380" y2="170"/>  <!-- 4-5 -->
    <line x1="380" y1="170" x2="360" y2="300"/> <!-- 5-6 -->
    <line x1="380" y1="170" x2="500" y2="120"/> <!-- 5-7 -->
    <line x1="360" y1="300" x2="480" y2="330"/> <!-- 6-10 -->
    <line x1="500" y1="120" x2="620" y2="60"/>  <!-- 7-8 -->
    <line x1="620" y1="60" x2="620" y2="200"/>  <!-- 8-9 -->
    <line x1="620" y1="200" x2="500" y2="120"/> <!-- 9-7 -->
  </g>
  <g fill="#FFFFFF" stroke="#624AEF" stroke-width="3">
    <circle cx="60" cy="60" r="22"/><circle cx="160" cy="100" r="22"/><circle cx="140" cy="220" r="22"/>
    <circle cx="280" cy="80" r="22"/><circle cx="380" cy="170" r="22"/><circle cx="360" cy="300" r="22"/>
    <circle cx="500" cy="120" r="22"/><circle cx="620" cy="60" r="22"/><circle cx="620" cy="200" r="22"/>
    <circle cx="480" cy="330" r="22"/><circle cx="60" cy="300" r="22"/>
  </g>
  <g font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#141A2A" text-anchor="middle">
    <text x="60" y="66">1</text><text x="160" y="106">2</text><text x="140" y="226">3</text>
    <text x="280" y="86">4</text><text x="380" y="176">5</text><text x="360" y="306">6</text>
    <text x="500" y="126">7</text><text x="620" y="66">8</text><text x="620" y="206">9</text>
    <text x="480" y="336">10</text><text x="60" y="306">11</text>
  </g>
</svg>
