<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenges – Coding Challenges</title>
  <script>try{var t=JSON.parse(localStorage.getItem("cc.theme"));if(t&&t!=="system")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body data-page="katalog">
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <div class="page-head catalog-head">
      <div class="page-head-main">
        <h1>Challenges</h1>
        <p class="lead">Finde eine Challenge, löse sie mit deinen eigenen Werkzeugen und reiche deine Lösung ein.</p>
      </div>
    </div>

    <form class="filters" role="search" aria-label="Challenges filtern" onsubmit="return false">
      <div class="field">
        <label for="f-q">Suche</label>
        <div class="search">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input class="input" id="f-q" type="search" placeholder="Titel oder Beschreibung">
        </div>
      </div>
      <div class="field">
        <label for="f-format">Format</label>
        <select class="select" id="f-format">
          <option value="">Alle</option><option value="wert">Wert</option><option value="code">Code</option>
        </select>
      </div>
      <div class="field">
        <label for="f-diff">Schwierigkeit</label>
        <select class="select" id="f-diff">
          <option value="">Alle</option><option value="leicht">Leicht</option><option value="mittel">Mittel</option><option value="schwer">Schwer</option>
        </select>
      </div>
      <div class="field">
        <label for="f-status">Dein Status</label>
        <select class="select" id="f-status">
          <option value="">Alle</option><option value="offen">Offen</option><option value="geloest">Gelöst</option><option value="nicht-geloest">Nicht gelöst</option>
        </select>
      </div>
    </form>

    <div class="result-bar">
      <p class="muted" style="margin:0" aria-live="polite"><span id="result-count"></span></p>
    </div>
    <ul class="challenge-grid" id="challenge-list" aria-label="Challenges"></ul>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/katalog.js"></script>
</body>
</html>
